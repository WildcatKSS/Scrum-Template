# Synchroniseert de labels uit .github/labels.yml met de repository.
# Handmatig te starten (of automatisch bij wijziging van het labelbestand).
# 'prune: false' laat handmatig toegevoegde labels staan; zet op true om de repository
# exact gelijk te trekken met het bestand.
name: Labels sync

on:
  push:
    branches: ["main"]
    paths: [".github/labels.yml"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: sync-labels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: micnncim/action-label-syncer@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          manifest: .github/labels.yml
          prune: false
