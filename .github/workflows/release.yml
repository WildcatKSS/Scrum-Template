# Release — bouwt een releasekandidaat, controleert kwaliteit en security, deployt naar
# de testomgeving en zet productie-uitrol pas door na handmatige goedkeuring.
#
# Werkwijze:
#   1. Tag een commit op main volgens Semantic Versioning: v1.4.0 (of v1.4.0-rc.1).
#   2. Deze workflow bouwt, test, scant, genereert een SBOM en releasenotes.
#   3. Deployment naar 'staging' gebeurt automatisch — mits ingeschakeld, zie hieronder.
#   4. Deployment naar 'production' vereist goedkeuring via de GitHub Environment
#      'production' (Settings → Environments → production → Required reviewers).
#
# Eenmalig in te richten:
#   * Environments 'staging' en 'production', met required reviewers op production
#     (minimaal Product Owner + Security/Compliance — zie GOVERNANCE.md).
#   * Deploymentcredentials als environment secrets, bij voorkeur via OIDC
#     (permissions: id-token: write) in plaats van langlevende sleutels.
#   * De echte deploystappen (nu placeholders) invullen voor [CLOUD], en pas daarna de
#     repository-variabelen STAGING_DEPLOY_ENABLED / PRODUCTION_DEPLOY_ENABLED op 'true'
#     zetten. Staan die uit, dan worden de deployjobs overgeslagen en wordt er géén
#     deploymentbewijs geschreven — een release die niets uitrolt, mag ook niet
#     rapporteren dat er is uitgerold. Staan ze aan terwijl de placeholders er nog zijn,
#     dan faalt de job met een duidelijke melding.
#     Zie docs/operations/deployment.md §6.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versie (bijv. v1.4.0). Alleen voor een handmatige droogloop."
        required: true
        type: string
      channel:
        description: "Releasekanaal"
        required: true
        type: choice
        default: "test-group"
        options:
          - internal-prototype
          - test-group
          - beta
          - limited-production
          - general-availability

permissions:
  contents: read

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}
  CHANNEL: ${{ github.event.inputs.channel || 'test-group' }}
  TEMPLATE_STRICT: ${{ vars.TEMPLATE_STRICT || 'false' }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Releasekandidaat: bouwen en volledig controleren
  # ---------------------------------------------------------------------------
  release-candidate:
    name: release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: meta
        name: Versie bepalen
        run: |
          version="${VERSION}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if echo "${version}" | grep -qE '-(rc|alpha|beta)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Release ${version} — kanaal ${CHANNEL}"
      - uses: ./.github/actions/setup-stack
      - name: Build
        run: ./scripts/ci/build.sh
      - name: Regressietests (unit, integratie, end-to-end)
        run: |
          ./scripts/ci/test-unit.sh
          ./scripts/ci/test-integration.sh
          ./scripts/ci/test-e2e.sh
      - name: Dekkingsdrempel
        run: ./scripts/ci/coverage-check.sh
        env:
          COVERAGE_MIN: ${{ vars.COVERAGE_MIN || '70' }}
      - name: Toegankelijkheidscontrole
        run: ./scripts/ci/test-accessibility.sh
      - name: Artifact bewaren
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifact-${{ steps.meta.outputs.version }}
          path: |
            dist/
            build/
            out/
            target/*.jar
          if-no-files-found: ignore
          retention-days: 90

  # ---------------------------------------------------------------------------
  # 2. Security-, privacy- en compliancecheck vóór uitrol
  # ---------------------------------------------------------------------------
  release-checks:
    name: release-checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: release-candidate
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Securitytests
        run: ./scripts/ci/test-security.sh
      - name: Kwetsbaarhedenscan (blokkerend bij kritiek/hoog)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM genereren
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - name: Licentiecontrole
        run: ./scripts/ci/license-check.sh
      - name: SBOM bewaren als releasebewijs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ needs.release-candidate.outputs.version }}
          path: sbom.cyclonedx.json
          if-no-files-found: warn
          retention-days: 365
      - name: Handmatige goedkeuringen herinneren
        run: |
          {
            echo "### Vereiste goedkeuringen vóór productie"
            echo ""
            echo "- [ ] Product Owner — functionele acceptatie"
            echo "- [ ] Security — geen openstaande kritieke of hoge bevindingen"
            echo "- [ ] Privacy/Compliance — verwerkingen, bewaartermijnen en bewijs bijgewerkt"
            echo ""
            echo "Volledige lijst: \`docs/releases/release-checklist.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 3. Releasenotes en GitHub Release
  # ---------------------------------------------------------------------------
  release-notes:
    name: release-notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [release-candidate, release-checks]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Releasenotes samenstellen
        run: ./scripts/release/prepare-release-notes.sh "${{ needs.release-candidate.outputs.version }}" > RELEASE_NOTES.md
      - name: Notes tonen in de samenvatting
        run: cat RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"
      - name: GitHub Release aanmaken
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ needs.release-candidate.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.release-candidate.outputs.prerelease == 'true' }}
          draft: true # bewust concept: de PO publiceert pas na akkoord
          files: |
            RELEASE_NOTES.md

  # ---------------------------------------------------------------------------
  # 4. Deployment naar de testomgeving (automatisch)
  #
  # De deploystappen zijn placeholders zolang [CLOUD] niet is gekozen. Een job die
  # niets uitrolt en tóch groen afsluit met "deploy vastgelegd als bewijs" is erger
  # dan geen job: hij levert vals bewijs voor een control die niet heeft gedraaid.
  # Daarom draait deze job alleen wanneer de repository-variabele
  # STAGING_DEPLOY_ENABLED op 'true' staat. Staat die uit, dan wordt de job
  # overgeslagen (grijs, niet groen) en meldt deployment-status waarom.
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release-candidate, release-checks]
    if: vars.STAGING_DEPLOY_ENABLED == 'true'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL || 'https://staging.example.invalid' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Geen continue-on-error: is STAGING_DEPLOY_ENABLED gezet, dan hoort er een
      # artifact te zijn. Ontbreekt het, dan is er niets om uit te rollen en moet de
      # job falen in plaats van een lege deploy te suggereren.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifact-${{ needs.release-candidate.outputs.version }}

      # ⬇️ VERVANG DEZE STAP door de echte uitrol voor [CLOUD]. Zolang dat niet is
      # gebeurd, faalt de job bewust: STAGING_DEPLOY_ENABLED=true betekent "hier wordt
      # echt uitgerold", en die belofte moet waar zijn.
      #   AWS   : aws-actions/configure-aws-credentials (OIDC) + aws ecs update-service / aws s3 sync
      #   Azure : azure/login (OIDC) + azure/webapps-deploy
      #   GCP   : google-github-actions/auth (workload identity) + gcloud run deploy
      #   K8s   : kubectl set image / helm upgrade --install
      # Gebruik OIDC in plaats van langlevende sleutels; zie docs/security/access-control.md.
      - name: Deployen naar staging
        run: |
          echo "::error::Er is nog geen deploystap ingericht voor [CLOUD], terwijl STAGING_DEPLOY_ENABLED op 'true' staat. Vervang deze stap in .github/workflows/release.yml door de echte uitrol, of zet de variabele uit. Er is niets uitgerold."
          exit 1

      # ⬇️ VERVANG DEZE STAP door een echte rooktest, bijvoorbeeld:
      #   curl -fsS "${STAGING_URL}/health"
      - name: Rooktest na deploy
        run: |
          echo "::error::Er is nog geen rooktest ingericht. Zonder verificatie is een deploy niet aantoonbaar geslaagd."
          exit 1

      # Deze stap draait alleen wanneer alle voorgaande stappen zijn geslaagd — dus
      # nooit zonder daadwerkelijke uitrol en geslaagde rooktest.
      - name: Deploy vastleggen als bewijs
        run: |
          {
            echo "### Staging-deploy"
            echo "- Versie: ${{ needs.release-candidate.outputs.version }}"
            echo "- Kanaal: ${CHANNEL}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Tijd: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo ""
            echo "Neem deze gegevens op in \`docs/compliance/audit-evidence.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 5. Productie — alleen na handmatige goedkeuring in de environment
  #
  # Zelfde principe als bij staging: geen groene productiejob en geen releasebewijs
  # zonder daadwerkelijke uitrol. De goedkeuring via de environment 'production'
  # blijft ongewijzigd van kracht; de guard komt er alleen bovenop.
  # ---------------------------------------------------------------------------
  deploy-production:
    name: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [release-candidate, release-checks, deploy-staging]
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    # De environment 'production' moet required reviewers hebben ingesteld.
    # Zonder goedkeuring blijft deze job wachten en gebeurt er niets.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://example.invalid' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Voorwaarden controleren
        run: |
          if [ "${{ needs.release-candidate.outputs.prerelease }}" = "true" ]; then
            echo "::error::Een prerelease (rc/alpha/beta) gaat niet naar productie."
            exit 1
          fi
      # Geen continue-on-error: zonder artifact is er niets uit te rollen.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifact-${{ needs.release-candidate.outputs.version }}

      # ⬇️ VERVANG DEZE STAP door de echte, gefaseerde uitrol voor [CLOUD].
      # Advies: canary 5% → 25% → 100% met automatische terugval bij een stijgende
      # foutratio. Zie docs/operations/deployment.md.
      - name: Gecontroleerde uitrol
        run: |
          echo "::error::Er is nog geen productie-uitrol ingericht voor [CLOUD], terwijl PRODUCTION_DEPLOY_ENABLED op 'true' staat. Vervang deze stap in .github/workflows/release.yml door de echte uitrol, of zet de variabele uit. Er is niets uitgerold."
          exit 1

      # ⬇️ VERVANG DEZE STAP door echte verificatie na uitrol: bewaak minimaal 30
      # minuten foutratio, latency, mislukte inlogpogingen, mislukte transacties en
      # auditlogvolume. Zie docs/operations/monitoring.md en
      # docs/operations/service-level-objectives.md.
      - name: Monitoring na uitrol
        run: |
          echo "::error::Er is nog geen verificatie na uitrol ingericht. Een uitrol zonder waarneming is geen gecontroleerde uitrol."
          exit 1

      - name: Rollback beschikbaar houden
        run: |
          echo "::notice::Rollback: herdeploy van de vorige tag of uitschakelen van de feature flag."
          echo "Vastgelegd rollbackplan staat in de pull request en in docs/releases/release-process.md."

      # Draait alleen na een geslaagde uitrol én geslaagde verificatie.
      - name: Releasebewijs
        run: |
          {
            echo "### Productie-uitrol"
            echo "- Versie: ${{ needs.release-candidate.outputs.version }}"
            echo "- Goedgekeurd via environment 'production'"
            echo "- Commit: ${{ github.sha }}"
            echo "- Tijd: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo ""
            echo "Leg dit vast in \`docs/compliance/audit-evidence.md\` en plan de evaluatie na release."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 6. Zichtbaar maken wat er niet is gebeurd
  #
  # Een overgeslagen job is grijs en valt makkelijk weg. Deze job maakt expliciet dat
  # er geen deployment heeft plaatsgevonden, zodat niemand de release als uitgerold
  # beschouwt. Hij schrijft geen deploymentbewijs.
  # ---------------------------------------------------------------------------
  deployment-status:
    name: deployment-status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [release-candidate, release-checks, deploy-staging, deploy-production]
    if: always() && needs.release-checks.result == 'success'
    steps:
      - name: Deploymentstatus samenvatten
        env:
          STAGING_RESULT: ${{ needs.deploy-staging.result }}
          PRODUCTION_RESULT: ${{ needs.deploy-production.result }}
          STAGING_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
          PRODUCTION_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
        run: |
          {
            echo "### Deploymentstatus"
            echo ""
            echo "| Omgeving | Ingeschakeld | Resultaat |"
            echo "|---|---|---|"
            echo "| staging | ${STAGING_ENABLED:-niet gezet} | ${STAGING_RESULT} |"
            echo "| production | ${PRODUCTION_ENABLED:-niet gezet} | ${PRODUCTION_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${STAGING_RESULT}" = "skipped" ] || [ "${PRODUCTION_RESULT}" = "skipped" ]; then
            echo "::warning::Er heeft geen (volledige) deployment plaatsgevonden. Een overgeslagen deploymentjob is géén geslaagde deployment: er is niets uitgerold en er is geen deploymentbewijs vastgelegd. Zet STAGING_DEPLOY_ENABLED / PRODUCTION_DEPLOY_ENABLED op 'true' zodra de deploystappen in release.yml daadwerkelijk zijn ingevuld — zie docs/operations/deployment.md."
            {
              echo ""
              echo "> ⚠️ **Er is niets uitgerold.** De deploymentstappen in \`release.yml\` zijn nog"
              echo "> placeholders. Er is dan ook **geen deploymentbewijs** vastgelegd; deze release"
              echo "> telt niet als uitgerold. Zie \`docs/operations/deployment.md\` voor het inschakelen."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
